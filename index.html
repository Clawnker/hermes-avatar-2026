<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>New Hermes avatar — cyberpunk round</title>
<style>
  body { background:#0b0e13; color:#e8e6df; font-family:system-ui,sans-serif; display:flex; flex-direction:column; align-items:center; padding:24px 12px; }
  h1 { font-size:20px; margin-bottom:4px; }
  p.sub { color:#8a8f98; font-size:13px; margin-bottom:20px; text-align:center; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:16px; width:100%; max-width:640px; }
  .card { background:#12161e; border:1px solid #232a36; border-radius:14px; padding:12px; text-align:center; }
  img { width:100%; border-radius:50%; display:block; }
  .label { margin-top:10px; font-size:12px; color:#aab0ba; }
  .num { display:inline-block; background:#e8702a; color:#111; font-weight:700; border-radius:6px; padding:1px 7px; margin-right:6px; }
</style></head><body>
<h1>Hermes — cyberpunk remix</h1>
<p class="sub">Older, more cyberpunk. Reply 4, 5 or 6 — or ask for another remix.</p>
<div class="grid">
  <div class="card"><img src="4_cyber_trader.png" alt="candidate 4"><div class="label"><span class="num">4</span> Cyber-Trader — AR monocle, floating tickers</div></div>
  <div class="card"><img src="5_netrunner.png" alt="candidate 5"><div class="label"><span class="num">5</span> Netrunner — neural jack, circuit tattoos</div></div>
  <div class="card"><img src="6_fixer.png" alt="candidate 6"><div class="label"><span class="num">6</span> Fixer — chrome hand, claw emblem coat</div></div>
</div>
</body></html>
