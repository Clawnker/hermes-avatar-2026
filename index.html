<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>New Hermes avatar — pick one</title>
<style>
  body { background:#0b0e13; color:#e8e6df; font-family:system-ui,sans-serif; display:flex; flex-direction:column; align-items:center; padding:24px 12px; }
  h1 { font-size:20px; margin-bottom:4px; }
  p.sub { color:#8a8f98; font-size:13px; margin-bottom:20px; text-align:center; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:16px; width:100%; max-width:640px; }
  .card { background:#12161e; border:1px solid #232a36; border-radius:14px; padding:12px; text-align:center; }
  img { width:100%; border-radius:50%; display:block; }
  .label { margin-top:10px; font-size:12px; color:#aab0ba; }
  .num { display:inline-block; background:#e8702a; color:#111; font-weight:700; border-radius:6px; padding:1px 7px; margin-right:6px; }
</style></head><body>
<h1>New Hermes avatar</h1>
<p class="sub">Reply with 1, 2 or 3 — or tell me how to remix.</p>
<div class="grid">
  <div class="card"><img src="1_trading.png" alt="candidate 1"><div class="label"><span class="num">1</span> Trading — order-book glasses, candlestick hoodie</div></div>
  <div class="card"><img src="2_automation.png" alt="candidate 2"><div class="label"><span class="num">2</span> Automation — workflow-node jacket, drone</div></div>
  <div class="card"><img src="3_ops_claw.png" alt="candidate 3"><div class="label"><span class="num">3</span> Ops/Claw — ops jacket, orange claw orbs</div></div>
</div>
</body></html>
